<div class="w-full">

  <div class="flex items-center">

    <!-- Step 1 -->
    <div class="flex items-center gap-2">

      <div
        class="flex h-7 w-7 shrink-0 items-center justify-center
               rounded-full text-xs font-semibold"
        [class.bg-emerald-100]="currentStep() > 1"
        [class.text-emerald-700]="currentStep() > 1"
        [class.bg-indigo-600]="currentStep() === 1"
        [class.text-white]="currentStep() === 1">

        @if (currentStep() > 1) {
          ✓
        } @else {
          1
        }

      </div>

      <span
        class="text-sm font-medium"
        [class.text-emerald-700]="currentStep() > 1"
        [class.text-slate-900]="currentStep() === 1">
        {{ 'stepper.plan' | translate }}
      </span>

    </div>


    <!-- Line 1 -->
    <div
      class="mx-4 h-px flex-1"
      [class.bg-emerald-300]="currentStep() > 1"
      [class.bg-slate-200]="currentStep() <= 1">
    </div>


    <!-- Step 2 -->
    <div class="flex items-center gap-2">

      <div
        class="flex h-7 w-7 shrink-0 items-center justify-center
               rounded-full text-xs font-semibold"

        [class.bg-emerald-100]="currentStep() > 2"
        [class.text-emerald-700]="currentStep() > 2"

        [class.bg-indigo-600]="currentStep() === 2"
        [class.text-white]="currentStep() === 2"

        [class.bg-slate-100]="currentStep() < 2"
        [class.text-slate-400]="currentStep() < 2">

        @if (currentStep() > 2) {
          ✓
        } @else {
          2
        }

      </div>

      <span
        class="text-sm font-medium"
        [class.text-emerald-700]="currentStep() > 2"
        [class.text-slate-900]="currentStep() === 2"
        [class.text-slate-400]="currentStep() < 2">

        {{ 'stepper.payment' | translate }}

      </span>

    </div>


    <!-- Line 2 -->
    <div
      class="mx-4 h-px flex-1"
      [class.bg-emerald-300]="currentStep() > 2"
      [class.bg-slate-200]="currentStep() <= 2">
    </div>


    <!-- Step 3 -->
    <div class="flex items-center gap-2">

      <div
        class="flex h-7 w-7 shrink-0 items-center justify-center
               rounded-full text-xs font-semibold"

        [class.bg-emerald-100]="currentStep() > 3"
        [class.text-emerald-700]="currentStep() > 3"

        [class.bg-indigo-600]="currentStep() === 3"
        [class.text-white]="currentStep() === 3"

        [class.bg-slate-100]="currentStep() < 3"
        [class.text-slate-400]="currentStep() < 3">

        @if (currentStep() > 3) {
          ✓
        } @else {
          3
        }

      </div>

      <span
        class="text-sm font-medium"
        [class.text-slate-900]="currentStep() === 3"
        [class.text-slate-400]="currentStep() < 3">

        {{ 'stepper.confirmation' | translate }}

      </span>

    </div>

  </div>

</div>
